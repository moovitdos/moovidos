     The look is Material 3 (assets/board.css) in the colours of the site; the icons are Material Symbols. -->

<body>

  <!-- the privacy notice (the owner asked for it before the forum opens to everybody, 4.10.2026): what the forum keeps
       and why. Shown at forum.html#privacy (board.js, view "privacy"); linked from both footers and the sign-up dialog.
       Every sentence here is a fact of the code - cloud/board/README.md "Information security". Change both together. -->
  <template id="privacy-text">
    <p>מה נשמר כשאתם משתמשים בפורום של מובידוס, ולמה. בקצרה: רק מה שצריך כדי שהפורום יעבוד. שום דבר לא נמכר, ואין כאן פרסומות.</p>
    <h3>מה גלוי לכולם</h3>
    <ul>
      <li>שם המשתמש, תמונת הפרופיל ומה שכתבתם בפרופיל.</li>
      <li>הנושאים וההודעות שכתבתם, התמונות שצירפתם, הלייקים, ההצבעות והסימנים.</li>
      <li>כשאתם קוראים נושא או כותבים בו, מי שקורא אותו באותו רגע רואה את זה. אפשר לבטל את זה בהגדרות החשבון.</li>
    </ul>
    <h3>מה נשמר ולא מוצג לאיש</h3>
    <ul>
      <li><strong>כתובת המייל</strong>: לקוד האימות בהרשמה, לאיפוס סיסמה ולמיילים שבחרתם לקבל. היא נשמרת מוצפנת. העותק שנשאר בתיבת הדואר שממנה נשלח אליכם מייל נמחק מיד אחרי השליחה.</li>
      <li><strong>בכניסה עם Google</strong> לא נשמר אצלנו דבר מהחשבון, מלבד סימן מוצפן שמזהה אותו. הכתובת עצמה נשמרת רק אם בחרתם לקבל מיילים.</li>
      <li>ההגדרות שלכם: אילו מיילים לקבל, התראות בדפדפן, אחרי אילו נושאים ומשתמשים אתם עוקבים, ועד איפה קראתם בכל נושא.</li>
    </ul>
    <h3>מה לא נשמר בכלל</h3>
    <ul>
      <li><strong>הסיסמה</strong> לא יוצאת מהדפדפן שלכם. נשלח אלינו רק מפתח שנגזר ממנה, ואצלנו נשמר רק סימן מוצפן שלו.</li>
      <li><strong>כתובת הרשת (IP)</strong> לא נשמרת. כדי לעצור הצפות סופרים פעולות לפי סימן מוצפן שלה, והוא נמחק אחרי יומיים.</li>
      <li>אין עוגיות ואין כלי מעקב או סטטיסטיקה. הדפדפן שלכם שומר אצלו את החיבור לפורום, כדי שלא תצטרכו להתחבר בכל ביקור.</li>
      <li><strong>טיוטות</strong>: נושא או תגובה שהתחלתם לכתוב ולא שלחתם נשמרים בדפדפן שלכם בלבד. הם לא מגיעים אלינו, ונמחקים מהדפדפן כשיוצאים מהחשבון.</li>
    </ul>
    <h3>איפה זה שמור</h3>
    <p>הפורום רץ ב-Cloudflare, והמידע שמור במסד נתונים באירופה. מיילים יוצאים מחשבון ה-Gmail של מובידוס.</p>
    <h3>מחיקה</h3>
    <p>בהגדרות החשבון אפשר למחוק את החשבון. אז נמחקים כתובת המייל, התמונה, החיבורים, ההגדרות וההתראות. ההודעות שכתבתם נשארות בפורום בשם "משתמש שנמחק". הודעה שאתם מוחקים נמחקת באמת, עם התמונה והגרסאות הקודמות שלה.</p>
    <h3>מיילים</h3>
    <p>יוצא אליכם רק מה שבחרתם. בהגדרות החשבון יש מתג לכל סוג מייל, ובכל מייל יש קישור להפסקה.</p>
    <h3>שאר האתר</h3>
    <p>האתר מתארח ב-GitHub Pages, והגופנים נטענים מ-Google Fonts. טופס "כתבו לנו" נשלח דרך Formspree, וההרשמה לעדכונים במייל היא טופס של Google.</p>
    <h3>שאלות</h3>
    <p>כתבו אלינו: <a href="mailto:moovitdos@gmail.com" class="ltr">moovitdos@gmail.com</a></p>
    <p class="muted small">עודכן ב-5.10.2026</p>
  </template>
